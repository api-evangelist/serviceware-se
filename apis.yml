name: Serviceware SE
description: 'Serviceware SE is a German enterprise software, consulting, and managed-services
  company with more than 25 years in business, roughly 420 employees, and over EUR 100
  million in annual revenue. Its platform spans Enterprise Service Management (ESM) for IT,
  HR, and customer service, IT Financial Management (ITFM) for cost tracking and technology
  business management, Corporate Performance Management (CPM) for budgeting, planning, and
  reporting, AI-powered Knowledge Management, and Field Service Management. Serviceware
  positions its platform as AI-native, with no-code workflows, data integration, governance,
  and self-service capabilities. It was surfaced as a portfolio company of Norwest Venture
  Partners and added to the API Evangelist network. No public developer portal, API reference,
  or machine-readable API surface was found during enrichment.'
